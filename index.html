<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#06080D',
              surface: '#0B101D',

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    body {

      color: #F8FAFC;
      font-family: 'Inter', sans-serif;

      background: rgba(11, 16, 29, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .bg-grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    .bg-grid-light {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
    }
    @keyframes pulseSlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }

<body class="bg-brand-dark text-slate-100 antialiased selection:bg-brand-accent selection:text-black">
  
  <div id="root"></div>

  <!-- React Babel Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper to render Lucide SVG icons safely
    const Icon = ({ name, className = "w-5 h-5", style = {} }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const iconNode = window.lucide.createIcons({
            icons: { [name]: true },
            attrs: { class: className }
          });
        }
      }, [name, className]);
      
      // Fallback icon rendering
      return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', ...style }} />;
    };

    // NAVBAR COMPONENT
    const Navbar = ({ onNavigateToAssessment }) => {
      const [isScrolled, setIsScrolled] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);
      const [solutionsOpen, setSolutionsOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 20);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const solutions = [
        { title: 'Intelligent Automation', desc: 'Process analysis & outcome-driven automation strategies', icon: 'zap', href: '#services' },
        { title: 'Power Platform', desc: 'Custom apps, workflows, Dataverse & M365 integration', icon: 'layers', href: '#services' },
        { title: 'RPA / UiPath', desc: 'Desktop & enterprise bot automation for legacy systems', icon: 'workflow', href: '#services' },
        { title: 'Agentic AI', desc: 'Autonomous AI agents with reasoning & human oversight', icon: 'bot', href: '#agentic-ai' },

        <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-[#06080D]/90 backdrop-blur-md border-b border-white/10 py-3 shadow-xl' : 'bg-transparent py-5 border-b border-white/5'}`}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between">
              
              <a href="#" className="flex items-center gap-3 group">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-indigo-600 p-0.5 shadow-glow-cyan">
                  <div className="w-full h-full bg-[#0B101D] rounded-[10px] flex items-center justify-center">
                    <Icon name="cpu" className="w-5 h-5 text-cyan-400" />
                  </div>
                </div>

              </a>

                    Solutions

                  {solutionsOpen && (
                    <div className="absolute top-full -left-4 w-80 pt-2">

                        <div className="space-y-1">
                          {solutions.map((item, idx) => (
                            <a key={idx} href={item.href} onClick={() => setSolutionsOpen(false)} className="flex items-start gap-3 p-2.5 rounded-xl hover:bg-white/5 transition-all group/item">

                              </div>

                              </div>
                            </a>
                          ))}
                        </div>
                      </div>

                <a href="#industries" className="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">Industries</a>
                <a href="#how-it-works" className="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">How It Works</a>
                <a href="#about" className="text-sm font-medium text-slate-300 hover:text-cyan-400 transition-colors">About</a>
              </nav>

              <a href="#use-cases" onClick={() => setMobileOpen(false)} className="block text-sm text-slate-200 py-1">Use Cases</a>
              <a href="#industries" onClick={() => setMobileOpen(false)} className="block text-sm text-slate-200 py-1">Industries</a>
              <a href="#how-it-works" onClick={() => setMobileOpen(false)} className="block text-sm text-slate-200 py-1">How It Works</a>

    // HERO NETWORK ABSTRACT VISUAL

                x1={`${node.x}%`}

          </svg>

          {/* Central Core Node */}
          <div className="relative z-20 flex flex-col items-center justify-center w-36 h-36 sm:w-44 sm:h-44 rounded-full bg-gradient-to-br from-[#0E172A] to-[#07090E] border-2 border-cyan-400 shadow-glow-cyan p-4 text-center group cursor-pointer">
            <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl bg-cyan-400/20 border border-cyan-400/40 flex items-center justify-center mb-2">
              <Icon name="sparkles" className="w-6 h-6 text-cyan-400 animate-pulse" />
            </div>
            <span className="text-xs sm:text-sm font-extrabold text-white tracking-wider font-sans uppercase">
              YOUR BUSINESS
            </span>
            <span className="text-[10px] text-cyan-400 font-mono mt-0.5">
              Intelligent Layer
            </span>
          </div>

          {/* Surrounding Nodes */}
          {nodes.map((node) => {
            const isActive = activeNode === node.id;
            return (
              <div
                key={node.id}
                onMouseEnter={() => setActiveNode(node.id)}
                onMouseLeave={() => setActiveNode(null)}
                style={{ left: `${node.x}%`, top: `${node.y}%`, transform: 'translate(-50%, -50%)' }}
                className={`absolute z-20 flex items-center gap-2 px-3 py-2 rounded-xl transition-all duration-300 cursor-pointer ${isActive ? 'bg-[#111728] border-2 border-cyan-400 shadow-glow-cyan scale-110' : 'glass-panel-dark hover:border-white/30 hover:scale-105'}`}

                  <span className="text-xs font-semibold text-white font-sans">{node.label}</span>

    // HERO SECTION
    const HeroSection = ({ onNavigateToAssessment }) => {
      return (
        <section className="relative pt-32 pb-20 lg:pt-40 lg:pb-32 overflow-hidden bg-brand-dark">
          <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[500px] bg-gradient-to-tr from-cyan-500/10 via-indigo-500/10 to-transparent blur-[120px] rounded-full pointer-events-none" />
          <div className="absolute inset-0 bg-grid-pattern opacity-40 pointer-events-none" />

          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">

              <div className="lg:col-span-7 space-y-8 text-left">

                  <Icon name="sparkles" className="w-4 h-4 text-cyan-400 animate-pulse" />
                  <span className="text-xs font-bold font-mono text-cyan-400 uppercase tracking-wider">

                    Intelligent Automation.
                  </span>
                </h1>

                <p className="text-lg sm:text-xl text-slate-300 font-normal leading-relaxed max-w-2xl">
                  We transform repetitive business processes into intelligent workflows, applications, RPA automations, and AI-powered solutions—so your team can spend less time on routine work and more time creating value.
                </p>

                <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 pt-2">
                  <button onClick={onNavigateToAssessment} className="px-7 py-4 rounded-xl bg-cyan-400 text-slate-950 font-bold text-base shadow-glow-cyan hover:bg-white transition-all flex items-center justify-center gap-3">
                    <span>Tell Us What You Want to Automate</span>
                    <Icon name="arrow-right" className="w-5 h-5" />

                  <a href="#services" className="px-7 py-4 rounded-xl glass-panel-dark border border-white/15 text-white font-semibold text-base hover:bg-white/10 transition-all flex items-center justify-center gap-2">
                    <span>Explore Our Solutions</span>
                    <Icon name="chevron-right" className="w-5 h-5 text-slate-400" />

                </div>

                <div className="pt-2 text-sm text-slate-400 font-medium flex items-center gap-2">
                  <Icon name="check-circle" className="w-4 h-4 text-cyan-400" />
                  <span>Automate workflows. Connect systems. Empower people.</span>

                    <span>RPA</span>
                    <span className="text-slate-600">·</span>
                    <span className="text-indigo-400">AI AGENTS</span>

        { title: 'Reporting', desc: 'Collect information and prepare recurring reports.', icon: 'bar-chart-3', tag: 'Manual Analytics' },

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
              {services.map((s, idx) => (
                <div key={idx} className="glass-panel-dark p-6 rounded-3xl border border-white/10 hover:border-cyan-400/50 transition-all flex flex-col justify-between group">
                  <div>
                    <div className="w-12 h-12 rounded-2xl bg-cyan-400/10 border border-cyan-400/20 text-cyan-400 flex items-center justify-center mb-4">
                      <Icon name={s.icon} className="w-6 h-6" />
                    </div>
                    <h3 className="text-xl font-bold text-white mb-1">{s.title}</h3>
                    <div className="text-xs font-mono text-cyan-400 mb-3">{s.tagline}</div>
                    <p className="text-sm text-slate-300 leading-relaxed">{s.desc}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    // AGENTIC AI SECTION
    const AgenticAISection = ({ onNavigateToAssessment }) => {
      return (
        <section id="agentic-ai" className="py-24 bg-[#05070C] text-white relative overflow-hidden border-t border-white/10">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-12">
            <div className="space-y-4">
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-panel-dark border border-cyan-400/40 text-cyan-400 text-xs font-mono font-bold uppercase">
                THE NEXT LAYER OF AUTOMATION
              </div>
              <h2 className="text-4xl sm:text-5xl font-extrabold text-white">
                Automation That Can <span className="text-cyan-400">Understand.</span>
              </h2>
              <p className="text-lg text-slate-300 max-w-3xl mx-auto">
                Traditional automation follows predefined rules. Agentic AI can interpret requests, understand context, access knowledge, determine appropriate next steps, and trigger actions within defined objectives and controls.
              </p>
            </div>

            {/* AI Core Component Graphic */}
            <div className="max-w-4xl mx-auto glass-panel-dark p-8 sm:p-12 rounded-3xl border border-cyan-400/30 text-center space-y-8">
              <div className="inline-block px-4 py-1.5 rounded-full bg-cyan-400/10 border border-cyan-400/30 text-cyan-400 text-xs font-mono font-bold">
                CONCEPT: AI + AUTOMATION + HUMAN OVERSIGHT
              </div>

              <div className="flex flex-wrap items-center justify-center gap-4 text-xs font-mono font-bold">
                {['UNDERSTAND', 'REASON', 'ACCESS', 'DECIDE', 'ACT', 'ESCALATE'].map((step, idx) => (
                  <span key={idx} className="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-cyan-400">
                    {step}
                  </span>
                ))}
              </div>

              <div className="pt-4 text-xs text-slate-400 font-mono">
                Integrated with: Business Knowledge · Documents · CRM · ERP · APIs · Power Automate · RPA · Humans
              </div>
            </div>
          </div>
        </section>
      );
    };

    // ASSESSMENT FORM
    const AssessmentForm = () => {
      const [submitted, setSubmitted] = useState(false);
      const [formData, setFormData] = useState({
        name: '', company: '', email: '', jobTitle: '', processToAutomate: '', currentWorkflow: '', systemsInvolved: ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitted(true);
      };

      return (
        <section id="assessment" className="py-24 bg-brand-surface text-white relative border-t border-white/10">
          <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center space-y-4 mb-12">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full glass-panel-dark border border-cyan-400/40 text-cyan-400 text-xs font-mono font-bold uppercase">
                START WITH THE PROBLEM
              </div>
              <h2 className="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-white">
                Tell Us What You Want to Automate
              </h2>
              <p className="text-slate-300">No technical knowledge required. We'll map the optimal solution.</p>
            </div>

            <div className="glass-panel-dark p-8 sm:p-12 rounded-3xl border border-cyan-400/30 shadow-2xl">
              {submitted ? (
                <div className="text-center py-10 space-y-4">
                  <div className="w-16 h-16 rounded-full bg-cyan-400/20 text-cyan-400 border border-cyan-400 flex items-center justify-center mx-auto">
                    <Icon name="check-circle" className="w-8 h-8" />
                  </div>
                  <h3 className="text-2xl font-bold">Assessment Request Received!</h3>
                  <p className="text-slate-300 text-sm">Thank you, {formData.name}. Our automation architects are reviewing your process requirement for {formData.company}.</p>
                  <button onClick={() => setSubmitted(false)} className="mt-4 px-4 py-2 border border-white/20 text-xs rounded-xl text-slate-300">
                    Submit another process
                  </button>
                </div>
              ) : (
                <form onSubmit={handleSubmit} className="space-y-6 text-left">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Full Name *</label>
                      <input type="text" required placeholder="Jane Doe" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2.5 bg-black/40 border border-white/15 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Company Name *</label>
                      <input type="text" required placeholder="Acme Enterprise" value={formData.company} onChange={e=>setFormData({...formData, company: e.target.value})} className="w-full px-4 py-2.5 bg-black/40 border border-white/15 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Work Email *</label>
                      <input type="email" required placeholder="jane@company.com" value={formData.email} onChange={e=>setFormData({...formData, email: e.target.value})} className="w-full px-4 py-2.5 bg-black/40 border border-white/15 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Job Title *</label>
                      <input type="text" required placeholder="VP of Operations" value={formData.jobTitle} onChange={e=>setFormData({...formData, jobTitle: e.target.value})} className="w-full px-4 py-2.5 bg-black/40 border border-white/15 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400" />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">What process would you like to automate? *</label>
                    <input type="text" required placeholder="e.g. Invoice matching & ERP entry" value={formData.processToAutomate} onChange={e=>setFormData({...formData, processToAutomate: e.target.value})} className="w-full px-4 py-2.5 bg-black/40 border border-white/15 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400" />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">How does the process work today? *</label>
                    <textarea rows={3} required placeholder="Describe current manual steps..." value={formData.currentWorkflow} onChange={e=>setFormData({...formData, currentWorkflow: e.target.value})} className="w-full px-4 py-2.5 bg-black/40 border border-white/15 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400" />
                  </div>

                  <button type="submit" className="w-full py-4 rounded-xl bg-cyan-400 text-slate-950 font-bold text-base shadow-glow-cyan hover:bg-white transition-all flex items-center justify-center gap-2">
                    <span>Request Automation Assessment →</span>
                  </button>
                </form>
              )}
            </div>
          </div>
        </section>
      );
    };

    // MAIN APP
    const App = () => {
      const scrollToAssessment = () => {
        document.getElementById('assessment')?.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div>
          <Navbar onNavigateToAssessment={scrollToAssessment} />
          <main>
            <HeroSection onNavigateToAssessment={scrollToAssessment} />
            <ProblemSection onNavigateToAssessment={scrollToAssessment} />
            <ServicesSection onNavigateToAssessment={scrollToAssessment} />
            <AgenticAISection onNavigateToAssessment={scrollToAssessment} />
            <AssessmentForm />
          </main>
          <footer className="bg-[#040609] py-12 border-t border-white/10 text-center text-xs text-slate-500 font-mono">
            © {new Date().getFullYear()} CogniFlow Intelligent Automation. All rights reserved.
          </footer>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
